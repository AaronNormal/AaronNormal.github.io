/* phone demo (second screen): switched off, a tap on the switch, then Everl on. CSS only, loops, clean frames */
.scr.dmx{position:relative;overflow:hidden}
.scr.dmx img{display:block;width:100%;height:auto}
.scr.dmx .fb{position:absolute;inset:0;opacity:0;animation:dmxb 8s ease-in-out infinite}
.scr.dmx .tp{position:absolute;left:82.5%;top:49.6%;width:13%;aspect-ratio:1;margin:-6.5% 0 0 -6.5%;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 0 2px rgba(255,255,255,.85);opacity:0;pointer-events:none;animation:dmxt 8s ease-out infinite}
@keyframes dmxb{0%,30%{opacity:0;transform:translateY(2%)}34%,90%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}
@keyframes dmxt{0%,20%{opacity:0;transform:scale(.6)}24%{opacity:1;transform:scale(1)}31%,100%{opacity:0;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){.scr.dmx .fb{animation:none;opacity:1;transform:none}.scr.dmx .tp{display:none}}
