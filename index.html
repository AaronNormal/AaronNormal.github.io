<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockups</title>
<style>
:root{--paper:#F4F3EF;--ink:#121212;--sub:#5e5e58;--hair:rgba(18,18,18,.09)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 -apple-system,"SF Pro Text",BlinkMacSystemFont,"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:64px 16px}
h1{font:700 34px/1.1 -apple-system,"SF Pro Display",BlinkMacSystemFont,"Inter Tight","Inter",system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 24px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
li{border-bottom:1px solid var(--hair)}
a{display:flex;justify-content:space-between;padding:16px 0;color:var(--ink);text-decoration:none;font-weight:600}
a span{font-weight:400;color:var(--sub)}
a:hover{text-decoration:underline;text-underline-offset:3px}
</style></head><body><main>
<h1>Mockups</h1>
<ul>
<li><a href="/everl/">Everl <span>Website, app and logo kit</span></a></li>

</main></body></html>
